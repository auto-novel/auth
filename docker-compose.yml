services:
  web:
    image: ghcr.io/auto-novel/auth-web:latest
    restart: unless-stopped
    ports:
      - 4000:80
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://127.0.0.1/ || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/auto-novel/auth-api:latest
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - REFRESH_TOKEN_SECRET
      - ACCESS_TOKEN_SECRET
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - MAILGUN_DOMAIN
      - MAILGUN_APIKEY
      - TURNSTILE_SECRET
      - TURNSTILE_HOSTNAMES
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://127.0.0.1:8080/health || exit 1',
        ]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres:17.7-alpine3.23
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER=auth
      - POSTGRES_DB=auth
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: auth
    driver: bridge
